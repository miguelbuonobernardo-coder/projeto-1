<!DOCTYPE html>
<html lang="pt-br">
    <head>

   <body>
<header>

      <main>
        <img src="imagem-blog.png" alt="Logotipo quadrado para noticiário do Corinthians. Ao centro, destaca-se o escudo oficial do Sport Club Corinthians Paulista em vermelho, branco e preto. Abaixo do escudo, está escrito em letras maiúsculas brancas: "CORINTHIANS NOTÍCIAS DO TIMÃO O fundo é preto com linhas geométricas sutis em cinza-escuro, cercado por uma fina borda dourada. Na parte inferior central, há um pequeno ícone branco de um globo com antenas de transmissão.>
        <div>

        <button>❤️ <span>0</span></button>

    <script>
        const botao = document.querySelector("button");
        botao.addEventListener("click", botaoclicado);

        function botaoclicado(){
            console.log("fui clicado");
            let texto = botao. querySelector("span");
            texto.textContent++;
        }
